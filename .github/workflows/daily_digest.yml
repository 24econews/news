name: Daily Economy Digest

on:
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set SSL certificate path
        run: echo "SSL_CERT_FILE=$(python -c 'import certifi; print(certifi.where())')" >> $GITHUB_ENV

      - name: Run Argentina pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          python scheduler/daily_pipeline.py --country argentina

      - name: Run Brazil pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          cp config_brazil.yaml scheduler/config_brazil.yaml
          python scheduler/daily_pipeline.py --country brazil

      - name: Run Chile pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          cp config_chile.yaml scheduler/config_chile.yaml
          python scheduler/daily_pipeline.py --country chile

      - name: Run Uruguay pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          cp config_uruguay.yaml scheduler/config_uruguay.yaml
          python scheduler/daily_pipeline.py --country uruguay

      - name: Run Paraguay pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          cp config_paraguay.yaml scheduler/config_paraguay.yaml
          python scheduler/daily_pipeline.py --country paraguay

      - name: Run Bolivia pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          cp config_bolivia.yaml scheduler/config_bolivia.yaml
          python scheduler/daily_pipeline.py --country bolivia

      - name: Cross-link stories across countries
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scheduler/run_all_countries.py --cross-link-only

      - name: Check if OpEd day (Mon/Tue/Thu/Fri)
        id: check_oped_day
        run: |
          DOW=$(date +%u)
          if [ "$DOW" = "1" ] || [ "$DOW" = "2" ] || [ "$DOW" = "4" ] || [ "$DOW" = "5" ]; then
            echo "is_oped_day=true" >> $GITHUB_OUTPUT
          else
            echo "is_oped_day=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate OpEd piece
        if: steps.check_oped_day.outputs.is_oped_day == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python generation/oped_builder.py

      # Must run after "Generate OpEd piece" (not bundled into the
      # cross-linking step above) so that on OpEd days, that same day's
      # OpEd file already exists on disk before opinion_linker looks for a
      # relevant piece to link — otherwise it silently falls back to an
      # older piece instead of today's own, more relevant one. Runs every
      # day (not just OpEd days) since Related Opinion still needs to stay
      # current on non-OpEd days; it just won't find a same-day piece then.
      - name: Link Related Opinion pieces into today's digests
        run: |
          python scheduler/run_all_countries.py --link-opinions-only

      - name: Check if Friday
        id: check_day
        run: |
          if [ "$(date +%u)" = "5" ]; then
            echo "is_friday=true" >> $GITHUB_OUTPUT
          else
            echo "is_friday=false" >> $GITHUB_OUTPUT
          fi

      # Runs after "Generate OpEd piece" (not before) so that on Fridays —
      # which are both a weekly-briefing day and an OpEd day — that same day's
      # OpEd file already exists on disk before gather_recent_opeds() runs.
      # With the reverse order, a same-day OpEd would be dated exactly on the
      # window's inclusive upper bound but not yet exist at gather time, and
      # would then fall on next week's exclusive lower bound too — silently
      # and permanently dropped from every Opinion Roundup.
      - name: Generate Weekly Briefing
        if: github.event_name == 'schedule' &&
            steps.check_day.outputs.is_friday == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python publishing/weekly_briefing.py

      # Newsletter sending moved to a separate Friday-morning workflow
      # (.github/workflows/send_newsletter.yml) which runs a few hours after
      # this workflow's Friday run generates the briefing, rather than
      # sending inline here.

      # - name: Send Weekly Newsletter via Buttondown
      #   if: github.event_name == 'schedule' &&
      #       steps.check_day.outputs.is_friday == 'true'
      #   env:
      #     BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
      #   run: |
      #     python publishing/buttondown_sender.py

      - name: Commit and push new digests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          if git diff --staged --quiet; then
            echo "No new digest files — nothing to commit"
          else
            git commit -m "Daily digest $(date -u +%Y-%m-%d)"
            git push origin main
          fi

      # X (Twitter) posting is paused as of July 2026 — the X API
      # free tier does not include write/posting credits for this
      # account, and requires the paid Basic tier (~$100/month) to
      # post tweets. Re-enable this step once revenue justifies the
      # cost. See publishing/x_poster.py and publishing/post_all_countries.py
      # for the (working, tested) implementation — it only needs
      # valid paid-tier credentials to function.

      # - name: Post to X
      #   env:
      #     X_API_KEY: ${{ secrets.X_API_KEY }}
      #     X_API_SECRET: ${{ secrets.X_API_SECRET }}
      #     X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      #     X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      #   run: |
      #     python publishing/post_all_countries.py

      - name: Post to Bluesky
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          python publishing/post_all_countries_bluesky.py

      # Placed after "Commit and push new digests" (same as the country-digest
      # Bluesky step above) rather than immediately after OpEd generation, so
      # the linked /opinion page is actually live on the site before it's posted.
      - name: Post OpEd to Bluesky
        if: steps.check_oped_day.outputs.is_oped_day == 'true'
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          python publishing/oped_bluesky_poster.py
