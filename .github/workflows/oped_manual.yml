name: Generate OpEd (Manual)

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Publishing date (YYYY-MM-DD, must be Mon/Wed/Fri). Leave blank for today.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate-oped:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set SSL certificate path
        run: echo "SSL_CERT_FILE=$(python -c 'import certifi; print(certifi.where())')" >> $GITHUB_ENV

      - name: Generate OpEd piece
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python generation/oped_builder.py --date "${{ github.event.inputs.date }}"
          else
            python generation/oped_builder.py
          fi

      - name: Commit and push new OpEd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/opinion/
          if git diff --staged --quiet; then
            echo "No new OpEd file — nothing to commit"
          else
            git commit -m "Generate OpEd $(date -u +%Y-%m-%d)"
            git push origin HEAD:${{ github.ref_name }}
          fi
